appId: com.goldenpalace.pos
productName: GOLDEN PALACE POS
copyright: Copyright © GOLDEN PALACE POS
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - electron/**/*
  - build/icon.ico
  - build/icon.png
  - package.json
npmRebuild: true
asarUnpack:
  - dist/**/*
  - dist-electron/**/*
  - build/icon.ico
  - build/icon.png
  - node_modules/better-sqlite3/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*
  - node_modules/bcryptjs/**/*
  - node_modules/iconv-lite/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: GoldenPalacePOS-Setup-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GOLDEN PALACE POS
  uninstallDisplayName: GOLDEN PALACE POS
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
