name: Build Windows x64 Desktop Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Windows x64 Electron 22 Release Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS (x64)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: 'x64'
          cache: 'npm'

      - name: Initialize CI log directory & verify Windows MSVC C++20 toolchain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release\ci-logs" | Out-Null
          $log = "release\ci-logs\00-environment.log"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msvcPath = ""
          if (Test-Path $vswhere) {
            $msvcPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          }
          if (-not $msvcPath) {
            throw "Windows MSVC C++ Build Tools not detected on runner; required to compile better-sqlite3 (C++20) for Electron ABI 110."
          }
          @(
            "Runner OS      : $($env:RUNNER_OS)",
            "Runner Arch    : $($env:RUNNER_ARCH)",
            "Node.js        : $(node -v)",
            "npm            : $(npm -v)",
            "Python         : $(python --version 2>&1)",
            "Visual Studio  : $msvcPath",
            "GitHub Run ID  : $($env:GITHUB_RUN_ID)",
            "GitHub Run Num : $($env:GITHUB_RUN_NUMBER)",
            "GitHub Ref     : $($env:GITHUB_REF_NAME)",
            "GitHub SHA     : $($env:GITHUB_SHA)",
            "Timestamp UTC  : $((Get-Date).ToUniversalTime().ToString('o'))"
          ) | Tee-Object -FilePath $log

      - name: Install pinned dependencies from package-lock.json (including optional native bindings)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          npm ci --include=optional --legacy-peer-deps --no-audit --no-fund 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath "release\ci-logs\00b-npm-ci.log"
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed with exit code $LASTEXITCODE" }

      - name: Mandatory Windows Rolldown Native Binding Diagnostics & Pinned Version Gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $diagLog = "release\ci-logs\00c-rolldown-diagnostics.log"
          $envLog = "release\ci-logs\00-environment.log"
          $diagFailed = $false
          $failureCase = "NONE"

          function Log-Diag([string]$msg) {
            $msg | Tee-Object -FilePath $diagLog -Append
          }

          Log-Diag "=== MANDATORY WINDOWS ROLLDOWN NATIVE BINDING DIAGNOSTICS ==="
          Log-Diag "Timestamp UTC       : $((Get-Date).ToUniversalTime().ToString('o'))"
          Log-Diag "Node / npm          : $(node -v) / $(npm -v)"
          Log-Diag "package-lock SHA256 : $((Get-FileHash 'package-lock.json' -Algorithm SHA256).Hash.ToLower())"
          Log-Diag "npm config omit     : $(npm config get omit)"
          Log-Diag "npm config include  : $(npm config get include)"
          Log-Diag "npm config os / cpu : $(npm config get os) / $(npm config get cpu)"
          Log-Diag "npm legacy-peer-deps: $(npm config get legacy-peer-deps)"

          # Verify lockfile itself contains the Windows Rolldown binding entry
          $lockCheck = node -e "const l=JSON.parse(require('fs').readFileSync('package-lock.json','utf8')); const e=l.packages['node_modules/@rolldown/binding-win32-x64-msvc']; console.log(e ? JSON.stringify({version:e.version,os:e.os,cpu:e.cpu,optional:e.optional,hasResolved:Boolean(e.resolved),hasIntegrity:Boolean(e.integrity)}) : 'MISSING_IN_LOCKFILE');" 2>&1
          Log-Diag "lockfile entry      : $lockCheck"

          $bindingDir = "node_modules\@rolldown\binding-win32-x64-msvc"
          $bindingPkgPath = "$bindingDir\package.json"
          $bindingBinPath = "$bindingDir\rolldown-binding.win32-x64-msvc.node"

          # Diagnostic 1: Directory existence
          $dirExists = Test-Path $bindingDir
          Log-Diag "[1/8] Binding directory exists ($bindingDir): $dirExists"

          # Diagnostic 2 & 3 & 6: package.json existence, exact version 1.2.11, OS/CPU metadata
          $pkgExists = Test-Path $bindingPkgPath
          Log-Diag "[2/8] Binding package.json exists: $pkgExists"
          $installedVer = "MISSING"
          $pkgOs = "MISSING"
          $pkgCpu = "MISSING"
          $pkgMain = "MISSING"
          if ($pkgExists) {
            try {
              $pkgObj = Get-Content $bindingPkgPath -Raw | ConvertFrom-Json
              $installedVer = $pkgObj.version
              $pkgOs = ($pkgObj.os -join ",")
              $pkgCpu = ($pkgObj.cpu -join ",")
              $pkgMain = $pkgObj.main
            } catch {
              $installedVer = "CORRUPT_JSON: $($_.Exception.Message)"
            }
          }
          Log-Diag "[3/8] Installed version (expected 1.2.11): $installedVer | main=$pkgMain"
          Log-Diag "[6/8] Package OS/CPU metadata (expected win32/x64): os=[$pkgOs] cpu=[$pkgCpu]"

          # Diagnostic 4 & 8: Native .node binary existence, file listing, size, PE32+ header & SHA-256
          $binExists = Test-Path $bindingBinPath
          Log-Diag "[4/8] Native .node binary exists ($bindingBinPath): $binExists"
          if ($dirExists) {
            Log-Diag "[8/8] Binding package directory contents:"
            Get-ChildItem -Path $bindingDir -Force | ForEach-Object {
              $itemHash = if (-not $_.PSIsContainer) { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() } else { "DIR" }
              Log-Diag ("      - {0} ({1} bytes) SHA256={2}" -f $_.Name, $_.Length, $itemHash)
            }
          } else {
            Log-Diag "[8/8] Binding package directory missing; cannot inspect contents."
          }

          $binPeValid = $false
          if ($binExists) {
            $bBytes = [System.IO.File]::ReadAllBytes($bindingBinPath)
            if ($bBytes.Length -ge 64 -and $bBytes[0] -eq 0x4D -and $bBytes[1] -eq 0x5A) {
              $bPeOffset = [System.BitConverter]::ToInt32($bBytes, 0x3C)
              $bMachine = [System.BitConverter]::ToUInt16($bBytes, $bPeOffset + 4)
              $binPeValid = ($bMachine -eq 0x8664)
              Log-Diag ("      Native binary PE check: MZ=true Machine=0x{0:X4} Size={1} bytes (expected PE32+ 0x8664)" -f $bMachine, $bBytes.Length)
            } else {
              Log-Diag ("      Native binary PE check: INVALID (missing MZ header, Size={0} bytes)" -f $bBytes.Length)
            }
          }

          # Diagnostic 7: npm ls report
          Log-Diag "[7/8] npm ls @rolldown/binding-win32-x64-msvc --all:"
          $npmLsOut = npm ls @rolldown/binding-win32-x64-msvc --all 2>&1
          $npmLsExit = $LASTEXITCODE
          foreach ($line in $npmLsOut) { Log-Diag "      $line" }
          Log-Diag "      npm ls exit code: $npmLsExit"

          # Loader inspection: rolldown/dist/shared/binding-*.mjs
          $loaderFiles = Get-ChildItem -Path "node_modules\rolldown\dist\shared" -Filter "binding-*.mjs" -ErrorAction SilentlyContinue
          foreach ($lf in $loaderFiles) {
            Log-Diag "Loader file inspected: $($lf.FullName)"
          }

          # Diagnostic 5: Node.js resolution & direct native module load test (captures full Error.cause chain)
          Log-Diag "[5/8] Node.js runtime, resolution & direct native binding load test:"
          $nodeDiagScript = @'
          const path = require("node:path");
          console.log("Runtime:", JSON.stringify({
            platform: process.platform,
            arch: process.arch,
            node: process.version,
            abi: process.versions.modules,
            shlib_suffix: process.config?.variables?.shlib_suffix,
            node_target_type: process.config?.variables?.node_target_type
          }));
          const dumpErr = (label, err) => {
            let cur = err;
            let depth = 0;
            while (cur && depth < 10) {
              console.log(`${label} [cause depth ${depth}]: code=${cur.code || "NONE"} message=${cur.message}`);
              cur = cur.cause;
              depth++;
            }
          };
          let failed = false;
          try {
            const resolvedPkg = require.resolve("@rolldown/binding-win32-x64-msvc/package.json");
            const resolvedMain = require.resolve("@rolldown/binding-win32-x64-msvc");
            console.log("require.resolve(package.json):", resolvedPkg);
            console.log("require.resolve(main):", resolvedMain);
          } catch (err) {
            failed = true;
            dumpErr("RESOLVE_ERROR", err);
          }
          try {
            const mod = require("@rolldown/binding-win32-x64-msvc");
            console.log("Direct require(@rolldown/binding-win32-x64-msvc): OK, export keys =", Object.keys(mod).length);
          } catch (err) {
            failed = true;
            dumpErr("DIRECT_LOAD_ERROR", err);
          }
          (async () => {
            try {
              const rd = await import("rolldown");
              console.log("ESM import(rolldown): OK, VERSION =", rd.VERSION || "loaded");
            } catch (err) {
              failed = true;
              dumpErr("ROLLDOWN_IMPORT_ERROR", err);
            }
            process.exit(failed ? 1 : 0);
          })();
          '@
          $nodeDiagOut = node -e $nodeDiagScript 2>&1
          $nodeDiagExit = $LASTEXITCODE
          foreach ($line in $nodeDiagOut) { Log-Diag "      $line" }
          Log-Diag "      Node.js resolution & load exit code: $nodeDiagExit"

          # Classify Case A / B / C explicitly
          if (-not $dirExists -or -not $pkgExists) {
            $failureCase = "CASE_A_PACKAGE_MISSING_AFTER_NPM_CI"
            $diagFailed = $true
          } elseif (-not $binExists -or -not $binPeValid) {
            $failureCase = "CASE_B_PACKAGE_EXISTS_BINARY_MISSING_OR_CORRUPT"
            $diagFailed = $true
          } elseif ($installedVer -ne "1.2.11" -or $pkgOs -ne "win32" -or $pkgCpu -ne "x64") {
            $failureCase = "CASE_B_METADATA_OR_VERSION_MISMATCH"
            $diagFailed = $true
          } elseif ($nodeDiagExit -ne 0) {
            $failureCase = "CASE_C_BINARY_EXISTS_NATIVE_LOAD_FAILED"
            $diagFailed = $true
          }
          Log-Diag "DIAGNOSTIC CLASSIFICATION: $failureCase"

          if ($diagFailed) {
            # Also attach filtered npm debug log clues (zero secrets)
            $npmLogsDir = Join-Path $env:LOCALAPPDATA "npm-cache\_logs"
            if (Test-Path $npmLogsDir) {
              $latestLog = Get-ChildItem $npmLogsDir -Filter "*.log" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if ($latestLog) {
                Log-Diag "Filtered npm debug log lines ($($latestLog.Name)):"
                Select-String -Path $latestLog.FullName -Pattern "rolldown|optional|EBADPLATFORM|EINTEGRITY|failed optional" | Select-Object -First 40 | ForEach-Object {
                  Log-Diag "      $($_.Line)"
                }
              }
            }
            throw "ROLLDOWN WINDOWS BINDING DIAGNOSTIC FAILED [$failureCase]. Inspect release\ci-logs\00c-rolldown-diagnostics.log for complete evidence."
          }

          $ErrorActionPreference = 'Stop'
          $electronVer = (Get-Content "node_modules\electron\package.json" -Raw | ConvertFrom-Json).version
          $sqliteVer = (Get-Content "node_modules\better-sqlite3\package.json" -Raw | ConvertFrom-Json).version
          $viteVer = (Get-Content "node_modules\vite\package.json" -Raw | ConvertFrom-Json).version
          $rolldownVer = (Get-Content "node_modules\rolldown\package.json" -Raw | ConvertFrom-Json).version

          if ($electronVer -ne "22.3.27") {
            throw "Electron version drift detected! Strictly pinned to 22.3.27, found $electronVer"
          }
          if ($sqliteVer -ne "11.10.0") {
            throw "better-sqlite3 version drift detected! Expected 11.10.0, found $sqliteVer"
          }
          if ($viteVer -ne "8.3.1") {
            throw "Vite version drift detected! Expected 8.3.1, found $viteVer"
          }
          if ($rolldownVer -ne "1.2.11") {
            throw "Rolldown version drift detected! Expected 1.2.11, found $rolldownVer"
          }

          $requiredWinBindings = @(
            @{ Name = "@rolldown/binding-win32-x64-msvc"; Path = "node_modules\@rolldown\binding-win32-x64-msvc\package.json"; ExpectedVersion = $rolldownVer },
            @{ Name = "@tailwindcss/oxide-win32-x64-msvc"; Path = "node_modules\@tailwindcss\oxide-win32-x64-msvc\package.json"; ExpectedVersion = "4.3.3" },
            @{ Name = "lightningcss-win32-x64-msvc (root)"; Path = "node_modules\lightningcss-win32-x64-msvc\package.json"; ExpectedVersion = "1.33.0" },
            @{ Name = "lightningcss-win32-x64-msvc (tailwind)"; Path = "node_modules\@tailwindcss\node\node_modules\lightningcss\node_modules\lightningcss-win32-x64-msvc\package.json"; ExpectedVersion = "1.32.0" },
            @{ Name = "@esbuild/win32-x64 (root)"; Path = "node_modules\@esbuild\win32-x64\package.json"; ExpectedVersion = "0.25.12" },
            @{ Name = "@typescript/typescript-win32-x64"; Path = "node_modules\@typescript\typescript-win32-x64\package.json"; ExpectedVersion = "7.0.2" }
          )

          foreach ($binding in $requiredWinBindings) {
            if (-not (Test-Path $binding.Path)) {
              throw ("DIAGNOSTIC FAILURE: Required Windows x64 optional native binding '{0}' is MISSING at '{1}' after 'npm ci --include=optional' (Node=$(node -v), npm=$(npm -v))." -f $binding.Name, $binding.Path)
            }
            $installedBindingVer = (Get-Content $binding.Path -Raw | ConvertFrom-Json).version
            if ($installedBindingVer -ne $binding.ExpectedVersion) {
              throw ("DIAGNOSTIC FAILURE: Binding '{0}' version mismatch! Expected {1}, found {2}" -f $binding.Name, $binding.ExpectedVersion, $installedBindingVer)
            }
            ("Verified Windows x64 native binding: {0}@{1}" -f $binding.Name, $installedBindingVer) | Tee-Object -FilePath $envLog -Append
          }

          "Verified pinned Node=$(node -v), npm=$(npm -v), Electron=$electronVer (ABI 110), better-sqlite3=$sqliteVer, Vite=$viteVer, Rolldown=$rolldownVer" | Tee-Object -FilePath $envLog -Append

      - name: Build Vite frontend and Node 16 Electron CJS server (before tests)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          npm run build:desktop 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath "release\ci-logs\01-build-desktop.log"
          if ($LASTEXITCODE -ne 0) { throw "npm run build:desktop failed with exit code $LASTEXITCODE" }
          if (Test-Path "dist\assets\aistudio") {
            throw "Development-only dist\assets\aistudio leaked into Vite production build!"
          }

      - name: Run complete automated QA & acceptance test suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          npm test -- --no-color 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath "release\ci-logs\02-test-suite.log"
          if ($LASTEXITCODE -ne 0) { throw "Automated test suite failed with exit code $LASTEXITCODE" }

      - name: Run TypeScript validation (tsc --noEmit)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          npm run lint 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath "release\ci-logs\03-typescript-validation.log"
          if ($LASTEXITCODE -ne 0) { throw "TypeScript validation failed with exit code $LASTEXITCODE" }

      - name: Rebuild native better-sqlite3 from source for Electron 22.3.27 (x64 ABI 110, MSVC C++20)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          npx electron-rebuild -f -w better-sqlite3 -v 22.3.27 --arch x64 --build-from-source 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath "release\ci-logs\04-electron-rebuild.log"
          if ($LASTEXITCODE -ne 0) { throw "electron-rebuild failed with exit code $LASTEXITCODE" }

      - name: Verify rebuilt native better_sqlite3.node (PE32+ x64 ABI 110) & record digest
        shell: pwsh
        run: |
          $native = "node_modules\better-sqlite3\build\Release\better_sqlite3.node"
          if (-not (Test-Path $native)) {
            throw "Native binary missing after electron-rebuild: $native"
          }
          $bytes = [System.IO.File]::ReadAllBytes($native)
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "better_sqlite3.node is not a valid Windows PE binary (missing MZ header)"
          }
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) {
            throw ("Expected PE32+ x64 (0x8664) native addon, got 0x{0:X4}" -f $machine)
          }
          $nativeHash = (Get-FileHash $native -Algorithm SHA256).Hash.ToLower()
          "NATIVE_SQLITE_SHA256=$nativeHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          ("Verified rebuilt PE32+ x64 (0x{0:X4}) better_sqlite3.node ({1} bytes) SHA256={2}" -f $machine, $bytes.Length, $nativeHash) | Tee-Object -FilePath "release\ci-logs\06-validation-report.log"

      - name: Package Windows x64 NSIS Installer (no auto-publish)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          npx electron-builder --win --x64 --publish never -c.npmRebuild=false 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath "release\ci-logs\05-electron-builder.log"
          if ($LASTEXITCODE -ne 0) { throw "electron-builder failed with exit code $LASTEXITCODE" }

      - name: Verify installer PE header, app.asar.unpacked resources, native ABI 110 match & SHA-256 checksum
        shell: pwsh
        run: |
          $valLog = "release\ci-logs\06-validation-report.log"
          $installer = "release\GoldenPalacePOS-Setup-x64.exe"
          $unpackedExe = "release\win-unpacked\GOLDEN PALACE POS.exe"
          $appAsar = "release\win-unpacked\resources\app.asar"
          $unpackedRoot = "release\win-unpacked\resources\app.asar.unpacked"
          $unpackedNative = "$unpackedRoot\node_modules\better-sqlite3\build\Release\better_sqlite3.node"

          $requiredPaths = @(
            $installer,
            $unpackedExe,
            $appAsar,
            $unpackedNative,
            "$unpackedRoot\dist-electron\server.cjs",
            "$unpackedRoot\dist\index.html",
            "$unpackedRoot\build\icon.ico",
            "$unpackedRoot\build\icon.png",
            "$unpackedRoot\node_modules\bindings\package.json",
            "$unpackedRoot\node_modules\file-uri-to-path\package.json",
            "$unpackedRoot\node_modules\bcryptjs\package.json",
            "$unpackedRoot\node_modules\iconv-lite\package.json"
          )

          foreach ($requiredPath in $requiredPaths) {
            if (-not (Test-Path $requiredPath)) {
              throw "Required packaged artifact missing: $requiredPath"
            }
            $item = Get-Item $requiredPath
            ("ASSET OK: {0} ({1} bytes)" -f $requiredPath, $item.Length) | Tee-Object -FilePath $valLog -Append
          }

          if ((Test-Path "dist\assets\aistudio") -or (Test-Path "$unpackedRoot\dist\assets\aistudio")) {
            throw "Development-only aistudio assets leaked into packaged dist!"
          }
          "ASSET HYGIENE OK: dist\assets\aistudio absent from dist and app.asar.unpacked" | Tee-Object -FilePath $valLog -Append

          # Verify PE32+ x64 (0x8664) on GOLDEN PALACE POS.exe
          $exeBytes = [System.IO.File]::ReadAllBytes($unpackedExe)
          $exePeOffset = [System.BitConverter]::ToInt32($exeBytes, 0x3C)
          $exeMachine = [System.BitConverter]::ToUInt16($exeBytes, $exePeOffset + 4)
          if ($exeMachine -ne 0x8664) {
            throw ("Expected PE32+ x64 (0x8664) app executable, got 0x{0:X4}" -f $exeMachine)
          }
          ("PE32+ OK: GOLDEN PALACE POS.exe Machine=0x{0:X4} ({1} bytes)" -f $exeMachine, $exeBytes.Length) | Tee-Object -FilePath $valLog -Append

          # Verify PE32+ x64 (0x8664) & exact SHA-256 match on unpacked better_sqlite3.node
          $unpackedNativeBytes = [System.IO.File]::ReadAllBytes($unpackedNative)
          $unpackedPeOffset = [System.BitConverter]::ToInt32($unpackedNativeBytes, 0x3C)
          $unpackedMachine = [System.BitConverter]::ToUInt16($unpackedNativeBytes, $unpackedPeOffset + 4)
          if ($unpackedMachine -ne 0x8664) {
            throw ("Expected PE32+ x64 (0x8664) unpacked better_sqlite3.node, got 0x{0:X4}" -f $unpackedMachine)
          }
          $unpackedNativeHash = (Get-FileHash $unpackedNative -Algorithm SHA256).Hash.ToLower()
          if ($unpackedNativeHash -ne $env:NATIVE_SQLITE_SHA256) {
            throw "Unpacked better_sqlite3.node SHA-256 mismatch! Expected $($env:NATIVE_SQLITE_SHA256), got $unpackedNativeHash"
          }
          ("NATIVE ADDON MATCH OK: unpacked better_sqlite3.node Machine=0x{0:X4} SHA256={1}" -f $unpackedMachine, $unpackedNativeHash) | Tee-Object -FilePath $valLog -Append

          # Verify valid Windows PE MZ header & minimum size on NSIS installer
          $installerBytes = [System.IO.File]::ReadAllBytes($installer)
          if ($installerBytes.Length -lt 10000000 -or $installerBytes[0] -ne 0x4D -or $installerBytes[1] -ne 0x5A) {
            throw "Installer binary invalid or unexpectedly small: $($installerBytes.Length) bytes"
          }
          $instPeOffset = [System.BitConverter]::ToInt32($installerBytes, 0x3C)
          $instMachine = [System.BitConverter]::ToUInt16($installerBytes, $instPeOffset + 4)
          ("INSTALLER PE OK: GoldenPalacePOS-Setup-x64.exe MZ valid, stub Machine=0x{0:X4}, size={1} bytes" -f $instMachine, $installerBytes.Length) | Tee-Object -FilePath $valLog -Append

          $file = Get-Item $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  GoldenPalacePOS-Setup-x64.exe" | Out-File -Encoding ascii "release\GoldenPalacePOS-Setup-x64.exe.sha256"

          $manifest = @{
            installer = "GoldenPalacePOS-Setup-x64.exe"
            version = "1.0.0"
            electronVersion = "22.3.27"
            electronAbi = 110
            betterSqlite3Version = "11.10.0"
            sqliteSchemaVersion = 4
            sizeBytes = $file.Length
            installerSha256 = $hash
            installerStubPeMachine = ("0x{0:X4}" -f $instMachine)
            appExePeMachine = ("0x{0:X4}" -f $exeMachine)
            nativeSqlitePeMachine = ("0x{0:X4}" -f $unpackedMachine)
            nativeSqliteSha256 = $unpackedNativeHash
            nativeSqliteSha256Matched = $true
            devAssetsExcluded = $true
            runnerOs = $env:RUNNER_OS
            runnerArch = $env:RUNNER_ARCH
            githubRunId = $env:GITHUB_RUN_ID
            githubRunNumber = $env:GITHUB_RUN_NUMBER
            githubRefName = $env:GITHUB_REF_NAME
            githubSha = $env:GITHUB_SHA
            builtAtUtc = (Get-Date).ToUniversalTime().ToString("o")
          }
          $manifest | ConvertTo-Json -Depth 4 | Out-File -Encoding utf8 "release\GoldenPalacePOS-Setup-x64.build-manifest.json"

          $summaryLines = @(
            '## Windows x64 Release Build Succeeded',
            '- Installer: `GoldenPalacePOS-Setup-x64.exe`',
            "- Size: $($file.Length) bytes",
            "- GitHub Run ID / Number: `$($env:GITHUB_RUN_ID)` / `#$($env:GITHUB_RUN_NUMBER)`",
            "- Commit SHA: `$($env:GITHUB_SHA)`",
            '- App & Native SQLite Architecture: Windows PE32+ x64 (`0x8664`) / Electron `22.3.27` (ABI `110`)',
            "- Installer SHA-256: `$hash`",
            "- Unpacked better_sqlite3.node SHA-256: `$unpackedNativeHash` (exact match verified)"
          )
          $summaryLines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          ("VERIFIED INSTALLER: {0} ({1} bytes) SHA256={2}" -f $installer, $file.Length, $hash) | Tee-Object -FilePath $valLog -Append

      - name: Upload Windows Installer, Checksum, Manifest & Validation Logs (Unique Run ID)
        uses: actions/upload-artifact@v4
        with:
          name: GoldenPalacePOS-Setup-x64-run-${{ github.run_number }}-${{ github.run_id }}
          path: |
            release/GoldenPalacePOS-Setup-x64.exe
            release/GoldenPalacePOS-Setup-x64.exe.sha256
            release/GoldenPalacePOS-Setup-x64.build-manifest.json
            release/ci-logs/*.log
          retention-days: 90
          if-no-files-found: error

      - name: Report build failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release\failure-logs" | Out-Null
          if (Test-Path "release\ci-logs") {
            Copy-Item "release\ci-logs\*" "release\failure-logs\" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "release\builder-debug.yml") {
            Copy-Item "release\builder-debug.yml" "release\failure-logs\" -Force
          }
          $npmLogs = Join-Path $env:LOCALAPPDATA "npm-cache\_logs"
          if (Test-Path $npmLogs) {
            Get-ChildItem $npmLogs -Filter "*.log" | Sort-Object LastWriteTime -Descending | Select-Object -First 5 | Copy-Item -Destination "release\failure-logs\" -Force
          }
          $failLines = @(
            '## Windows x64 Release Build Failed',
            "- Runner: windows-latest ($($env:RUNNER_ARCH))",
            "- Run ID / Number: $($env:GITHUB_RUN_ID) / #$($env:GITHUB_RUN_NUMBER)",
            "- Node: $(node -v)",
            "- npm: $(npm -v)",
            '- Inspect attached failure logs artifact and workflow step logs.'
          )
          $failLines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload failure diagnostic logs (Unique Run ID)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GoldenPalacePOS-Windows-Failure-Logs-run-${{ github.run_number }}-${{ github.run_id }}
          path: release/failure-logs/**/*
          retention-days: 90
          if-no-files-found: ignore
