name: Build Windows x64 Desktop Installer

on:
  workflow_dispatch:
    inputs:
      stop_before_packaging:
        description: 'Stop after Windows desktop build, TypeScript lint, and tests (skip NSIS packaging until owner review)'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Windows x64 Electron 22 Release Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS (x64)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: 'x64'
          cache: 'npm'

      - name: Initialize CI log directory, audit workflow revision & verify Windows MSVC C++20 toolchain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release\ci-logs" | Out-Null
          $log = "release\ci-logs\00-environment.log"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msvcPath = ""
          if (Test-Path $vswhere) {
            $msvcPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          }
          if (-not $msvcPath) {
            throw "Windows MSVC C++ Build Tools not detected on runner; required to compile better-sqlite3 (C++20) for Electron ABI 110."
          }
          $preCiNodeModulesExists = Test-Path "node_modules"
          $pkgSha256 = (Get-FileHash "package.json" -Algorithm SHA256).Hash.ToLower()
          $lockSha256 = (Get-FileHash "package-lock.json" -Algorithm SHA256).Hash.ToLower()
          @(
            "Runner OS              : $($env:RUNNER_OS)",
            "Runner Arch            : $($env:RUNNER_ARCH)",
            "Working Directory      : $((Get-Location).Path)",
            "Pre-CI node_modules    : $preCiNodeModulesExists (expected False — clean checkout)",
            "Node.js                : $(node -v)",
            "npm                    : $(npm -v)",
            "Python                 : $(python --version 2>&1)",
            "Visual Studio          : $msvcPath",
            "GitHub Run ID          : $($env:GITHUB_RUN_ID)",
            "GitHub Run Num         : $($env:GITHUB_RUN_NUMBER)",
            "GitHub Ref             : $($env:GITHUB_REF)",
            "GitHub SHA             : $($env:GITHUB_SHA)",
            "GitHub Workflow Ref    : $($env:GITHUB_WORKFLOW_REF)",
            "package.json SHA256    : $pkgSha256",
            "package-lock SHA256    : $lockSha256",
            "Stop Before Packaging  : ${{ inputs.stop_before_packaging }}",
            "Timestamp UTC          : $((Get-Date).ToUniversalTime().ToString('o'))"
          ) | Tee-Object -FilePath $log

      - name: Install pinned dependencies from package-lock.json (including optional native bindings)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          npm ci --include=optional --legacy-peer-deps --no-audit --no-fund 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath "release\ci-logs\00b-npm-ci.log"
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed with exit code $LASTEXITCODE" }

      - name: Mandatory Rolldown Diagnostics, Controlled Windows-Only Fallback & 5-Condition Hard Gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $diagLog = "release\ci-logs\00c-rolldown-diagnostics.log"
          $envLog = "release\ci-logs\00-environment.log"
          $bindingDir = "node_modules\@rolldown\binding-win32-x64-msvc"
          $bindingPkgPath = "$bindingDir\package.json"
          $bindingBinPath = "$bindingDir\rolldown-binding.win32-x64-msvc.node"

          function Log-Diag([string]$msg) {
            $msg | Tee-Object -FilePath $diagLog -Append
          }

          $nodeProbeScript = @'
          console.log("Runtime:", JSON.stringify({
            platform: process.platform,
            arch: process.arch,
            node: process.version,
            abi: process.versions.modules,
            shlib_suffix: process.config?.variables?.shlib_suffix,
            node_target_type: process.config?.variables?.node_target_type
          }));
          const dumpErr = (label, err) => {
            let cur = err;
            let depth = 0;
            while (cur && depth < 10) {
              console.log(`${label} [cause depth ${depth}]: code=${cur.code || "NONE"} message=${cur.message}`);
              cur = cur.cause;
              depth++;
            }
          };
          let resolveOk = false;
          let loadOk = false;
          try {
            const resolvedPkg = require.resolve("@rolldown/binding-win32-x64-msvc/package.json");
            const resolvedMain = require.resolve("@rolldown/binding-win32-x64-msvc");
            console.log("RESOLVE_OK package.json =", resolvedPkg);
            console.log("RESOLVE_OK main =", resolvedMain);
            resolveOk = true;
          } catch (err) {
            dumpErr("RESOLVE_ERROR", err);
          }
          try {
            const mod = require("@rolldown/binding-win32-x64-msvc");
            console.log("DIRECT_LOAD_OK export keys =", Object.keys(mod).length);
            loadOk = true;
          } catch (err) {
            dumpErr("DIRECT_LOAD_ERROR", err);
          }
          (async () => {
            let rolldownImportOk = false;
            try {
              const rd = await import("rolldown");
              console.log("ROLLDOWN_IMPORT_OK VERSION =", rd.VERSION || "loaded");
              rolldownImportOk = true;
            } catch (err) {
              dumpErr("ROLLDOWN_IMPORT_ERROR", err);
            }
            console.log("PROBE_SUMMARY=" + JSON.stringify({ resolveOk, loadOk, rolldownImportOk }));
            process.exit(resolveOk && loadOk && rolldownImportOk ? 0 : 1);
          })();
          '@

          function Invoke-RolldownBindingCheck([string]$Phase) {
            Log-Diag ""
            Log-Diag "=== ROLLDOWN BINDING DIAGNOSTICS [$Phase] ==="
            $dirExists = Test-Path $bindingDir
            $pkgExists = Test-Path $bindingPkgPath
            $binExists = Test-Path $bindingBinPath
            $installedVer = "MISSING"
            $pkgOs = "MISSING"
            $pkgCpu = "MISSING"
            $pkgMain = "MISSING"
            if ($pkgExists) {
              try {
                $pkgObj = Get-Content $bindingPkgPath -Raw | ConvertFrom-Json
                $installedVer = "$($pkgObj.version)"
                $pkgOs = ($pkgObj.os -join ",")
                $pkgCpu = ($pkgObj.cpu -join ",")
                $pkgMain = "$($pkgObj.main)"
              } catch {
                $installedVer = "CORRUPT_JSON: $($_.Exception.Message)"
              }
            }

            Log-Diag "[$Phase] 1. Binding directory exists ($bindingDir): $dirExists"
            Log-Diag "[$Phase] 2. Binding package.json exists: $pkgExists | version=$installedVer | main=$pkgMain | os=[$pkgOs] | cpu=[$pkgCpu]"
            Log-Diag "[$Phase] 3. Native .node binary exists ($bindingBinPath): $binExists"

            $binPeValid = $false
            $binSize = 0
            if ($dirExists) {
              Log-Diag "[$Phase]    Directory contents:"
              Get-ChildItem -Path $bindingDir -Force | ForEach-Object {
                $itemHash = if (-not $_.PSIsContainer) { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() } else { "DIR" }
                Log-Diag ("             - {0} ({1} bytes) SHA256={2}" -f $_.Name, $_.Length, $itemHash)
              }
            }
            if ($binExists) {
              $bBytes = [System.IO.File]::ReadAllBytes($bindingBinPath)
              $binSize = $bBytes.Length
              if ($bBytes.Length -ge 64 -and $bBytes[0] -eq 0x4D -and $bBytes[1] -eq 0x5A) {
                $bPeOffset = [System.BitConverter]::ToInt32($bBytes, 0x3C)
                $bMachine = [System.BitConverter]::ToUInt16($bBytes, $bPeOffset + 4)
                $binPeValid = ($bMachine -eq 0x8664)
                Log-Diag ("[$Phase]    PE header check: MZ=true Machine=0x{0:X4} Size={1} bytes (expected PE32+ 0x8664)" -f $bMachine, $bBytes.Length)
              } else {
                Log-Diag ("[$Phase]    PE header check: INVALID (Size={0} bytes)" -f $bBytes.Length)
              }
            }

            Log-Diag "[$Phase] 4. npm ls @rolldown/binding-win32-x64-msvc --all:"
            $npmLsOut = npm ls @rolldown/binding-win32-x64-msvc --all 2>&1
            $npmLsExit = $LASTEXITCODE
            foreach ($line in $npmLsOut) { Log-Diag "             $line" }
            Log-Diag "[$Phase]    npm ls exit code: $npmLsExit"

            Log-Diag "[$Phase] 5. Node.js require.resolve & direct native load:"
            $probeOut = node -e $nodeProbeScript 2>&1
            $probeExit = $LASTEXITCODE
            $resolveOk = $false
            $loadOk = $false
            $rolldownImportOk = $false
            foreach ($line in $probeOut) {
              $s = "$line"
              Log-Diag "             $s"
              if ($s -like "PROBE_SUMMARY=*") {
                $summaryObj = ($s.Substring("PROBE_SUMMARY=".Length)) | ConvertFrom-Json
                $resolveOk = [bool]$summaryObj.resolveOk
                $loadOk = [bool]$summaryObj.loadOk
                $rolldownImportOk = [bool]$summaryObj.rolldownImportOk
              }
            }
            Log-Diag "[$Phase]    Node probe exit code: $probeExit"

            return [PSCustomObject]@{
              Phase = $Phase
              DirExists = $dirExists
              PkgExists = $pkgExists
              VersionExact = ($installedVer -eq "1.2.11")
              InstalledVersion = $installedVer
              BinExists = $binExists
              BinPeValid = $binPeValid
              BinSize = $binSize
              ResolveOk = $resolveOk
              LoadOk = $loadOk
              RolldownImportOk = $rolldownImportOk
              AllPassed = ($dirExists -and $pkgExists -and ($installedVer -eq "1.2.11") -and $binExists -and $binPeValid -and $resolveOk -and $loadOk -and $rolldownImportOk)
            }
          }

          # Section 2 & 3: Record workflow revision, working dir, manifest & lockfile optionalDependencies
          $pkgShaBefore = (Get-FileHash "package.json" -Algorithm SHA256).Hash.ToLower()
          $lockShaBefore = (Get-FileHash "package-lock.json" -Algorithm SHA256).Hash.ToLower()
          Log-Diag "=== WORKFLOW REVISION & MANIFEST AUDIT ==="
          Log-Diag "Timestamp UTC         : $((Get-Date).ToUniversalTime().ToString('o'))"
          Log-Diag "Runner OS / Arch      : $($env:RUNNER_OS) / $($env:RUNNER_ARCH)"
          Log-Diag "GitHub SHA / Ref      : $($env:GITHUB_SHA) / $($env:GITHUB_REF)"
          Log-Diag "GitHub Workflow Ref   : $($env:GITHUB_WORKFLOW_REF)"
          Log-Diag "Working Directory     : $((Get-Location).Path)"
          Log-Diag "Node / npm            : $(node -v) / $(npm -v)"
          Log-Diag "package.json SHA256   : $pkgShaBefore"
          Log-Diag "package-lock SHA256   : $lockShaBefore"
          Log-Diag "npm config omit       : $(npm config get omit)"
          Log-Diag "npm config include    : $(npm config get include)"
          Log-Diag "npm config os / cpu   : $(npm config get os) / $(npm config get cpu)"

          $manifestAudit = node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); const l=JSON.parse(fs.readFileSync('package-lock.json','utf8')); console.log(JSON.stringify({ pkgOptionalDeps: p.optionalDependencies || null, lockRootOptionalDeps: l.packages['']?.optionalDependencies || null, lockWinBindingEntry: l.packages['node_modules/@rolldown/binding-win32-x64-msvc'] ? { version: l.packages['node_modules/@rolldown/binding-win32-x64-msvc'].version, os: l.packages['node_modules/@rolldown/binding-win32-x64-msvc'].os, cpu: l.packages['node_modules/@rolldown/binding-win32-x64-msvc'].cpu, optional: l.packages['node_modules/@rolldown/binding-win32-x64-msvc'].optional, dev: l.packages['node_modules/@rolldown/binding-win32-x64-msvc'].dev || false, hasResolved: Boolean(l.packages['node_modules/@rolldown/binding-win32-x64-msvc'].resolved), hasIntegrity: Boolean(l.packages['node_modules/@rolldown/binding-win32-x64-msvc'].integrity) } : null }));" 2>&1
          Log-Diag "Manifest & Lockfile   : $manifestAudit"

          # Initial Post-npm-ci Diagnostics
          $result = Invoke-RolldownBindingCheck -Phase "POST-NPM-CI"

          # Inspect npm logs for optional dependency failures whenever initial check did not pass
          if (-not $result.AllPassed) {
            Log-Diag ""
            Log-Diag "=== FILTERED NPM LOGS FOR OPTIONAL DEPENDENCY FAILURES ==="
            if (Test-Path "release\ci-logs\00b-npm-ci.log") {
              Select-String -Path "release\ci-logs\00b-npm-ci.log" -Pattern "rolldown|optional|EBADPLATFORM|EINTEGRITY|ERR!|warn" | Select-Object -First 40 | ForEach-Object {
                Log-Diag "  [00b-npm-ci.log] $($_.Line)"
              }
            }
            $npmLogsDir = Join-Path $env:LOCALAPPDATA "npm-cache\_logs"
            if (Test-Path $npmLogsDir) {
              $latestLog = Get-ChildItem $npmLogsDir -Filter "*.log" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if ($latestLog) {
                Log-Diag "  Latest npm cache log: $($latestLog.Name)"
                Select-String -Path $latestLog.FullName -Pattern "rolldown|optional|EBADPLATFORM|EINTEGRITY|failed optional" | Select-Object -First 40 | ForEach-Object {
                  Log-Diag "  [$($latestLog.Name)] $($_.Line)"
                }
              }
            }
          }

          # Section 4: Controlled Windows-Only Installation Fallback (ONLY if binding is absent after npm ci)
          $fallbackAttempted = $false
          if (($env:RUNNER_OS -eq 'Windows') -and (-not $result.DirExists -or -not $result.PkgExists -or -not $result.BinExists)) {
            $fallbackAttempted = $true
            $tmpFallbackDir = Join-Path $env:RUNNER_TEMP "rolldown-win64-fallback-$($env:GITHUB_RUN_ID)"
            if (Test-Path $tmpFallbackDir) { Remove-Item -Recurse -Force $tmpFallbackDir }
            New-Item -ItemType Directory -Force -Path $tmpFallbackDir | Out-Null

            Log-Diag ""
            Log-Diag "=== CONTROLLED WINDOWS-ONLY INSTALLATION FALLBACK ==="
            Log-Diag "Trigger: Binding absent after npm ci on Windows x64."
            Log-Diag "Isolation: Using --prefix `"$tmpFallbackDir`" so npm does not hit ERESOLVE against root peerDeps or mutate the 831 pinned packages in node_modules."
            Log-Diag "Command: npm install --prefix `"$tmpFallbackDir`" --no-save --package-lock=false --ignore-scripts --include=optional @rolldown/binding-win32-x64-msvc@1.2.11"
            $fbOut = npm install --prefix "$tmpFallbackDir" --no-save --package-lock=false --ignore-scripts --include=optional @rolldown/binding-win32-x64-msvc@1.2.11 2>&1
            $fbExit = $LASTEXITCODE
            foreach ($line in $fbOut) { Log-Diag "  [fallback] $line" }
            Log-Diag "Fallback exit code: $fbExit"

            # Verify zero mutation to package.json and package-lock.json
            $pkgShaAfter = (Get-FileHash "package.json" -Algorithm SHA256).Hash.ToLower()
            $lockShaAfter = (Get-FileHash "package-lock.json" -Algorithm SHA256).Hash.ToLower()
            Log-Diag "Post-fallback package.json SHA256 match : $($pkgShaAfter -eq $pkgShaBefore)"
            Log-Diag "Post-fallback package-lock SHA256 match : $($lockShaAfter -eq $lockShaBefore)"
            if (($pkgShaAfter -ne $pkgShaBefore) -or ($lockShaAfter -ne $lockShaBefore)) {
              Remove-Item -Recurse -Force $tmpFallbackDir -ErrorAction SilentlyContinue
              $ErrorActionPreference = 'Stop'
              throw "SAFETY VIOLATION: Controlled fallback unexpectedly modified package.json or package-lock.json!"
            }

            if ($fbExit -ne 0) {
              Remove-Item -Recurse -Force $tmpFallbackDir -ErrorAction SilentlyContinue
              $ErrorActionPreference = 'Stop'
              throw "CONTROLLED WINDOWS FALLBACK FAILED (exit code $fbExit). Stopping before Vite build; inspect release\ci-logs\00c-rolldown-diagnostics.log."
            }

            $stagedBinding = Join-Path $tmpFallbackDir "node_modules\@rolldown\binding-win32-x64-msvc"
            if (-not (Test-Path "$stagedBinding\package.json")) {
              Remove-Item -Recurse -Force $tmpFallbackDir -ErrorAction SilentlyContinue
              $ErrorActionPreference = 'Stop'
              throw "CONTROLLED WINDOWS FALLBACK FAILED: Staged package missing at $stagedBinding"
            }

            New-Item -ItemType Directory -Force -Path "node_modules\@rolldown" | Out-Null
            if (Test-Path $bindingDir) { Remove-Item -Recurse -Force $bindingDir }
            Copy-Item -Path $stagedBinding -Destination $bindingDir -Recurse -Force
            Remove-Item -Recurse -Force $tmpFallbackDir -ErrorAction SilentlyContinue
            Log-Diag "Copied verified @rolldown/binding-win32-x64-msvc@1.2.11 into $bindingDir (0 other node_modules packages touched)."

            # Repeat ALL checks after fallback
            $result = Invoke-RolldownBindingCheck -Phase "POST-FALLBACK"
          }

          # Section 5: Strict 5-Condition Hard Gate before npm run build:desktop
          Log-Diag ""
          Log-Diag "=== 5-CONDITION HARD GATE SUMMARY (fallbackAttempted=$fallbackAttempted) ==="
          Log-Diag "  Gate 1 — Binding package exists              : $($result.DirExists -and $result.PkgExists)"
          Log-Diag "  Gate 2 — Installed version equals 1.2.11     : $($result.VersionExact) (found: $($result.InstalledVersion))"
          Log-Diag "  Gate 3 — Native .node binary exists (PE32+)  : $($result.BinExists -and $result.BinPeValid) ($($result.BinSize) bytes)"
          Log-Diag "  Gate 4 — Node require.resolve succeeds       : $($result.ResolveOk)"
          Log-Diag "  Gate 5 — Node native load & rolldown import  : $($result.LoadOk -and $result.RolldownImportOk)"

          $ErrorActionPreference = 'Stop'
          if (-not $result.AllPassed) {
            throw "HARD GATE FAILED BEFORE npm run build:desktop. One or more of the 5 mandatory Rolldown binding conditions failed. Inspect release\ci-logs\00c-rolldown-diagnostics.log."
          }

          # Verify strict version pins & remaining Windows x64 bindings
          $electronVer = (Get-Content "node_modules\electron\package.json" -Raw | ConvertFrom-Json).version
          $sqliteVer = (Get-Content "node_modules\better-sqlite3\package.json" -Raw | ConvertFrom-Json).version
          $viteVer = (Get-Content "node_modules\vite\package.json" -Raw | ConvertFrom-Json).version
          $rolldownVer = (Get-Content "node_modules\rolldown\package.json" -Raw | ConvertFrom-Json).version

          if ($electronVer -ne "22.3.27") { throw "Electron version drift detected! Strictly pinned to 22.3.27, found $electronVer" }
          if ($sqliteVer -ne "11.10.0") { throw "better-sqlite3 version drift detected! Expected 11.10.0, found $sqliteVer" }
          if ($viteVer -ne "8.3.1") { throw "Vite version drift detected! Expected 8.3.1, found $viteVer" }
          if ($rolldownVer -ne "1.2.11") { throw "Rolldown version drift detected! Expected 1.2.11, found $rolldownVer" }

          $requiredWinBindings = @(
            @{ Name = "@rolldown/binding-win32-x64-msvc"; Path = "node_modules\@rolldown\binding-win32-x64-msvc\package.json"; ExpectedVersion = $rolldownVer },
            @{ Name = "@tailwindcss/oxide-win32-x64-msvc"; Path = "node_modules\@tailwindcss\oxide-win32-x64-msvc\package.json"; ExpectedVersion = "4.3.3" },
            @{ Name = "lightningcss-win32-x64-msvc (root)"; Path = "node_modules\lightningcss-win32-x64-msvc\package.json"; ExpectedVersion = "1.33.0" },
            @{ Name = "lightningcss-win32-x64-msvc (tailwind)"; Path = "node_modules\@tailwindcss\node\node_modules\lightningcss\node_modules\lightningcss-win32-x64-msvc\package.json"; ExpectedVersion = "1.32.0" },
            @{ Name = "@esbuild/win32-x64 (root)"; Path = "node_modules\@esbuild\win32-x64\package.json"; ExpectedVersion = "0.25.12" },
            @{ Name = "@typescript/typescript-win32-x64"; Path = "node_modules\@typescript\typescript-win32-x64\package.json"; ExpectedVersion = "7.0.2" }
          )

          foreach ($binding in $requiredWinBindings) {
            if (-not (Test-Path $binding.Path)) {
              throw ("HARD GATE FAILURE: Required Windows x64 binding '{0}' is missing at '{1}'." -f $binding.Name, $binding.Path)
            }
            $installedBindingVer = (Get-Content $binding.Path -Raw | ConvertFrom-Json).version
            if ($installedBindingVer -ne $binding.ExpectedVersion) {
              throw ("HARD GATE FAILURE: Binding '{0}' version mismatch! Expected {1}, found {2}" -f $binding.Name, $binding.ExpectedVersion, $installedBindingVer)
            }
            ("Verified Windows x64 native binding: {0}@{1}" -f $binding.Name, $installedBindingVer) | Tee-Object -FilePath $envLog -Append
          }

          "HARD GATE PASSED (fallbackAttempted=$fallbackAttempted): Node=$(node -v), npm=$(npm -v), Electron=$electronVer (ABI 110), better-sqlite3=$sqliteVer, Vite=$viteVer, Rolldown=$rolldownVer" | Tee-Object -FilePath $envLog -Append

      - name: Build Vite frontend and Node 16 Electron CJS server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          npm run build:desktop 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath "release\ci-logs\01-build-desktop.log"
          if ($LASTEXITCODE -ne 0) { throw "npm run build:desktop failed with exit code $LASTEXITCODE" }
          if (Test-Path "dist\assets\aistudio") {
            throw "Development-only dist\assets\aistudio leaked into Vite production build!"
          }

      - name: Run TypeScript validation (tsc --noEmit)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          npm run lint 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath "release\ci-logs\02-typescript-validation.log"
          if ($LASTEXITCODE -ne 0) { throw "TypeScript validation failed with exit code $LASTEXITCODE" }

      - name: Verify testing dependencies & ensure official desktop icons before tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          npm ls @testing-library/react @testing-library/dom 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath "release\ci-logs\02b-test-prereqs.log"
          if ($LASTEXITCODE -ne 0) { throw "Testing dependency verification failed (npm ls @testing-library/react @testing-library/dom exit $LASTEXITCODE)" }
          npm run ensure:icons 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath "release\ci-logs\02b-test-prereqs.log" -Append
          if ($LASTEXITCODE -ne 0) { throw "Desktop icon verification/generation failed (exit $LASTEXITCODE)" }

      - name: Run complete automated QA & acceptance test suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          npm test -- --no-color --maxWorkers=2 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath "release\ci-logs\03-test-suite.log"
          if ($LASTEXITCODE -ne 0) { throw "Automated test suite failed with exit code $LASTEXITCODE" }

      - name: Upload Windows Desktop Build & Diagnostics Logs (Stop Gate Before Packaging)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.stop_before_packaging == true }}
        uses: actions/upload-artifact@v4
        with:
          name: GoldenPalacePOS-DesktopBuild-Logs-run-${{ github.run_number }}-${{ github.run_id }}
          path: release/ci-logs/*.log
          retention-days: 90
          if-no-files-found: error

      - name: Record Stop Gate Before Installer Packaging
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.stop_before_packaging == true }}
        shell: pwsh
        run: |
          @(
            '## Windows x64 Desktop Build, TypeScript & Test Gate Passed (Stopped Before Packaging)',
            ('- Commit SHA: `{0}`' -f $env:GITHUB_SHA),
            ('- Run ID / Number: `{0}` / `#{1}`' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_NUMBER),
            '- Hard Gate (5/5 Rolldown Binding Conditions): **PASS**',
            '- `npm run build:desktop`: **PASS**',
            '- `npm run lint` (`tsc --noEmit`): **PASS**',
            '- `npm test`: **PASS**',
            '- Installer packaging intentionally skipped (`stop_before_packaging=true`) pending owner review.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Rebuild native better-sqlite3 from source for Electron 22.3.27 (x64 ABI 110, MSVC C++20)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.stop_before_packaging == true) }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $repoRoot = (Get-Location).Path
          $logFile = Join-Path $repoRoot "release\ci-logs\04-electron-rebuild.log"
          $rebuildCli = Join-Path $repoRoot "node_modules\@electron\rebuild\lib\cli.js"
          $repoSqlite = Join-Path $repoRoot "node_modules\better-sqlite3"
          if (-not (Test-Path $rebuildCli)) {
            throw "Pinned @electron/rebuild CLI missing at: $rebuildCli"
          }
          if (-not (Test-Path (Join-Path $repoSqlite "package.json"))) {
            throw "better-sqlite3 package missing at: $repoSqlite"
          }
          if (-not $env:RUNNER_TEMP) {
            throw "RUNNER_TEMP environment variable is not set; cannot create short physical staging directory."
          }

          $shortRoot = Join-Path $env:RUNNER_TEMP "er-b"
          $stagedNodeModules = Join-Path $shortRoot "node_modules"
          $stagedSqlite = Join-Path $stagedNodeModules "better-sqlite3"
          $locationPushed = $false

          try {
            if (Test-Path $shortRoot) {
              Remove-Item -Path $shortRoot -Recurse -Force
            }
            New-Item -ItemType Directory -Force -Path $stagedNodeModules | Out-Null
            Copy-Item -Path (Join-Path $repoRoot "package.json") -Destination (Join-Path $shortRoot "package.json") -Force
            Copy-Item -Path (Join-Path $repoRoot "package-lock.json") -Destination (Join-Path $shortRoot "package-lock.json") -Force
            Copy-Item -Path $repoSqlite -Destination $stagedSqlite -Recurse -Force

            $stagedBuildDir = Join-Path $stagedSqlite "build"
            if (Test-Path $stagedBuildDir) {
              Remove-Item -Path $stagedBuildDir -Recurse -Force
            }
            $stagedBinDir = Join-Path $stagedSqlite "bin"
            if (Test-Path $stagedBinDir) {
              Remove-Item -Path $stagedBinDir -Recurse -Force
            }

            $stagedPkgVer = (Get-Content (Join-Path $stagedSqlite "package.json") -Raw | ConvertFrom-Json).version
            if ($stagedPkgVer -ne "11.10.0") {
              throw ("Staged better-sqlite3 version mismatch! Expected 11.10.0, found {0}" -f $stagedPkgVer)
            }

            $resolvedStagedSqlite = (& node -e "console.log(require('fs').realpathSync.native(process.argv[1]))" $stagedSqlite).Trim()
            if ($LASTEXITCODE -ne 0 -or -not $resolvedStagedSqlite) {
              throw "Failed to resolve canonical realpath for staged better-sqlite3 directory: $stagedSqlite"
            }
            if ($resolvedStagedSqlite.Length -ge 80) {
              throw ("Staged better-sqlite3 canonical path is unexpectedly long ({0} chars): {1}" -f $resolvedStagedSqlite.Length, $resolvedStagedSqlite)
            }

            @(
              "=== NATIVE BETTER-SQLITE3 SHORT-PATH REBUILD ===",
              ("Repository Root        : {0} ({1} chars)" -f $repoRoot, $repoRoot.Length),
              ("Short Staging Root     : {0} ({1} chars)" -f $shortRoot, $shortRoot.Length),
              ("Staged better-sqlite3  : {0} ({1} chars)" -f $resolvedStagedSqlite, $resolvedStagedSqlite.Length),
              ("better-sqlite3 Version : {0}" -f $stagedPkgVer),
              ("Rebuild CLI            : {0}" -f $rebuildCli),
              "Command                : node <cli> -f -w better-sqlite3 -v 22.3.27 --arch x64 --build-from-source --module-dir <shortRoot>"
            ) | Tee-Object -FilePath $logFile

            Push-Location $shortRoot
            $locationPushed = $true

            $ErrorActionPreference = 'Continue'
            & node $rebuildCli -f -w better-sqlite3 -v 22.3.27 --arch x64 --build-from-source --module-dir $shortRoot 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath $logFile -Append
            $rebuildExit = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            if ($rebuildExit -ne 0) {
              throw "electron-rebuild failed with exit code $rebuildExit"
            }

            $stagedNative = Join-Path $stagedSqlite "build\Release\better_sqlite3.node"
            $stagedMeta = Join-Path $stagedSqlite "build\Release\.forge-meta"
            if (-not (Test-Path $stagedNative)) {
              throw "Rebuilt native binary missing in short staging directory: $stagedNative"
            }
            if (-not (Test-Path $stagedMeta)) {
              throw "Expected electron-rebuild .forge-meta missing in short staging directory: $stagedMeta"
            }
            $metaContent = (Get-Content $stagedMeta -Raw).Trim()
            if ($metaContent -ne "win32--x64--110") {
              throw ("Unexpected .forge-meta ABI marker! Expected 'win32--x64--110', found '{0}'" -f $metaContent)
            }

            $repoBuildDir = Join-Path $repoSqlite "build"
            if (Test-Path $repoBuildDir) {
              Remove-Item -Path $repoBuildDir -Recurse -Force
            }
            $repoBinDir = Join-Path $repoSqlite "bin"
            if (Test-Path $repoBinDir) {
              Remove-Item -Path $repoBinDir -Recurse -Force
            }

            $repoReleaseDir = Join-Path $repoBuildDir "Release"
            New-Item -ItemType Directory -Force -Path $repoReleaseDir | Out-Null
            $repoNative = Join-Path $repoReleaseDir "better_sqlite3.node"
            $repoMeta = Join-Path $repoReleaseDir ".forge-meta"
            Copy-Item -Path $stagedNative -Destination $repoNative -Force
            Copy-Item -Path $stagedMeta -Destination $repoMeta -Force

            $stagedHash = (Get-FileHash $stagedNative -Algorithm SHA256).Hash.ToLower()
            $repoHash = (Get-FileHash $repoNative -Algorithm SHA256).Hash.ToLower()
            if ($stagedHash -ne $repoHash) {
              throw ("Copied better_sqlite3.node SHA-256 mismatch! Staged={0}, Workspace={1}" -f $stagedHash, $repoHash)
            }

            @(
              ("Synced Rebuilt Binary  : {0}" -f $repoNative),
              ("ABI Marker (.forge-meta): {0}" -f $metaContent),
              ("Synced Binary SHA-256  : {0} (exact match verified)" -f $repoHash)
            ) | Tee-Object -FilePath $logFile -Append
          }
          finally {
            if ($locationPushed) {
              Pop-Location
            }
            if (Test-Path $shortRoot) {
              Remove-Item -Path $shortRoot -Recurse -Force -ErrorAction SilentlyContinue
            }
            $cleanupVerified = -not (Test-Path $shortRoot)
            ("Staging Cleanup        : removed={0} ({1})" -f $cleanupVerified, $shortRoot) | Tee-Object -FilePath $logFile -Append
          }

      - name: Verify rebuilt native better_sqlite3.node (PE32+ x64 ABI 110) & record digest
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.stop_before_packaging == true) }}
        shell: pwsh
        run: |
          $native = "node_modules\better-sqlite3\build\Release\better_sqlite3.node"
          if (-not (Test-Path $native)) {
            throw "Native binary missing after electron-rebuild: $native"
          }
          $bytes = [System.IO.File]::ReadAllBytes($native)
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "better_sqlite3.node is not a valid Windows PE binary (missing MZ header)"
          }
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) {
            throw ("Expected PE32+ x64 (0x8664) native addon, got 0x{0:X4}" -f $machine)
          }
          $nativeHash = (Get-FileHash $native -Algorithm SHA256).Hash.ToLower()
          "NATIVE_SQLITE_SHA256=$nativeHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          ("Verified rebuilt PE32+ x64 (0x{0:X4}) better_sqlite3.node ({1} bytes) SHA256={2}" -f $machine, $bytes.Length, $nativeHash) | Tee-Object -FilePath "release\ci-logs\06-validation-report.log"

      - name: Package Windows x64 NSIS Installer (no auto-publish)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.stop_before_packaging == true) }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          npx electron-builder --win --x64 --publish never -c.npmRebuild=false 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath "release\ci-logs\05-electron-builder.log"
          if ($LASTEXITCODE -ne 0) { throw "electron-builder failed with exit code $LASTEXITCODE" }

      - name: Verify installer PE header, app.asar.unpacked resources, native ABI 110 match & SHA-256 checksum
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.stop_before_packaging == true) }}
        shell: pwsh
        run: |
          $valLog = "release\ci-logs\06-validation-report.log"
          $installer = "release\GoldenPalacePOS-Setup-x64.exe"
          $unpackedExe = "release\win-unpacked\GOLDEN PALACE POS.exe"
          $appAsar = "release\win-unpacked\resources\app.asar"
          $unpackedRoot = "release\win-unpacked\resources\app.asar.unpacked"
          $unpackedNative = "$unpackedRoot\node_modules\better-sqlite3\build\Release\better_sqlite3.node"

          $requiredPaths = @(
            $installer,
            $unpackedExe,
            $appAsar,
            $unpackedNative,
            "$unpackedRoot\dist-electron\server.cjs",
            "$unpackedRoot\dist\index.html",
            "$unpackedRoot\build\icon.ico",
            "$unpackedRoot\build\icon.png",
            "$unpackedRoot\node_modules\bindings\package.json",
            "$unpackedRoot\node_modules\file-uri-to-path\package.json",
            "$unpackedRoot\node_modules\bcryptjs\package.json",
            "$unpackedRoot\node_modules\iconv-lite\package.json"
          )

          foreach ($requiredPath in $requiredPaths) {
            if (-not (Test-Path $requiredPath)) {
              throw "Required packaged artifact missing: $requiredPath"
            }
            $item = Get-Item $requiredPath
            ("ASSET OK: {0} ({1} bytes)" -f $requiredPath, $item.Length) | Tee-Object -FilePath $valLog -Append
          }

          if ((Test-Path "dist\assets\aistudio") -or (Test-Path "$unpackedRoot\dist\assets\aistudio")) {
            throw "Development-only aistudio assets leaked into packaged dist!"
          }
          "ASSET HYGIENE OK: dist\assets\aistudio absent from dist and app.asar.unpacked" | Tee-Object -FilePath $valLog -Append

          # Verify PE32+ x64 (0x8664) on GOLDEN PALACE POS.exe
          $exeBytes = [System.IO.File]::ReadAllBytes($unpackedExe)
          $exePeOffset = [System.BitConverter]::ToInt32($exeBytes, 0x3C)
          $exeMachine = [System.BitConverter]::ToUInt16($exeBytes, $exePeOffset + 4)
          if ($exeMachine -ne 0x8664) {
            throw ("Expected PE32+ x64 (0x8664) app executable, got 0x{0:X4}" -f $exeMachine)
          }
          ("PE32+ OK: GOLDEN PALACE POS.exe Machine=0x{0:X4} ({1} bytes)" -f $exeMachine, $exeBytes.Length) | Tee-Object -FilePath $valLog -Append

          # Verify PE32+ x64 (0x8664) & exact SHA-256 match on unpacked better_sqlite3.node
          $unpackedNativeBytes = [System.IO.File]::ReadAllBytes($unpackedNative)
          $unpackedPeOffset = [System.BitConverter]::ToInt32($unpackedNativeBytes, 0x3C)
          $unpackedMachine = [System.BitConverter]::ToUInt16($unpackedNativeBytes, $unpackedPeOffset + 4)
          if ($unpackedMachine -ne 0x8664) {
            throw ("Expected PE32+ x64 (0x8664) unpacked better_sqlite3.node, got 0x{0:X4}" -f $unpackedMachine)
          }
          $unpackedNativeHash = (Get-FileHash $unpackedNative -Algorithm SHA256).Hash.ToLower()
          if ($unpackedNativeHash -ne $env:NATIVE_SQLITE_SHA256) {
            throw "Unpacked better_sqlite3.node SHA-256 mismatch! Expected $($env:NATIVE_SQLITE_SHA256), got $unpackedNativeHash"
          }
          ("NATIVE ADDON MATCH OK: unpacked better_sqlite3.node Machine=0x{0:X4} SHA256={1}" -f $unpackedMachine, $unpackedNativeHash) | Tee-Object -FilePath $valLog -Append

          # Verify valid Windows PE MZ header & minimum size on NSIS installer
          $installerBytes = [System.IO.File]::ReadAllBytes($installer)
          if ($installerBytes.Length -lt 10000000 -or $installerBytes[0] -ne 0x4D -or $installerBytes[1] -ne 0x5A) {
            throw "Installer binary invalid or unexpectedly small: $($installerBytes.Length) bytes"
          }
          $instPeOffset = [System.BitConverter]::ToInt32($installerBytes, 0x3C)
          $instMachine = [System.BitConverter]::ToUInt16($installerBytes, $instPeOffset + 4)
          ("INSTALLER PE OK: GoldenPalacePOS-Setup-x64.exe MZ valid, stub Machine=0x{0:X4}, size={1} bytes" -f $instMachine, $installerBytes.Length) | Tee-Object -FilePath $valLog -Append

          $file = Get-Item $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  GoldenPalacePOS-Setup-x64.exe" | Out-File -Encoding ascii "release\GoldenPalacePOS-Setup-x64.exe.sha256"

          $manifest = @{
            installer = "GoldenPalacePOS-Setup-x64.exe"
            version = "1.0.0"
            electronVersion = "22.3.27"
            electronAbi = 110
            betterSqlite3Version = "11.10.0"
            sqliteSchemaVersion = 4
            sizeBytes = $file.Length
            installerSha256 = $hash
            installerStubPeMachine = ("0x{0:X4}" -f $instMachine)
            appExePeMachine = ("0x{0:X4}" -f $exeMachine)
            nativeSqlitePeMachine = ("0x{0:X4}" -f $unpackedMachine)
            nativeSqliteSha256 = $unpackedNativeHash
            nativeSqliteSha256Matched = $true
            devAssetsExcluded = $true
            runnerOs = $env:RUNNER_OS
            runnerArch = $env:RUNNER_ARCH
            githubRunId = $env:GITHUB_RUN_ID
            githubRunNumber = $env:GITHUB_RUN_NUMBER
            githubRefName = $env:GITHUB_REF_NAME
            githubSha = $env:GITHUB_SHA
            builtAtUtc = (Get-Date).ToUniversalTime().ToString("o")
          }
          $manifest | ConvertTo-Json -Depth 4 | Out-File -Encoding utf8 "release\GoldenPalacePOS-Setup-x64.build-manifest.json"

          $summaryLines = @(
            '## Windows x64 Release Build Succeeded',
            '- Installer: `GoldenPalacePOS-Setup-x64.exe`',
            ('- Size: {0} bytes' -f $file.Length),
            ('- GitHub Run ID / Number: `{0}` / `#{1}`' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_NUMBER),
            ('- Commit SHA: `{0}`' -f $env:GITHUB_SHA),
            '- App & Native SQLite Architecture: Windows PE32+ x64 (`0x8664`) / Electron `22.3.27` (ABI `110`)',
            ('- Installer SHA-256: `{0}`' -f $hash),
            ('- Unpacked better_sqlite3.node SHA-256: `{0}` (exact match verified)' -f $unpackedNativeHash)
          )
          $summaryLines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          ("VERIFIED INSTALLER: {0} ({1} bytes) SHA256={2}" -f $installer, $file.Length, $hash) | Tee-Object -FilePath $valLog -Append

      - name: Upload Windows Installer, Checksum, Manifest & Validation Logs (Unique Run ID)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.stop_before_packaging == true) }}
        uses: actions/upload-artifact@v4
        with:
          name: GoldenPalacePOS-Setup-x64-run-${{ github.run_number }}-${{ github.run_id }}
          path: |
            release/GoldenPalacePOS-Setup-x64.exe
            release/GoldenPalacePOS-Setup-x64.exe.sha256
            release/GoldenPalacePOS-Setup-x64.build-manifest.json
            release/ci-logs/*.log
          retention-days: 90
          if-no-files-found: error

      - name: Report build failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release\failure-logs" | Out-Null
          if (Test-Path "release\ci-logs") {
            Copy-Item "release\ci-logs\*" "release\failure-logs\" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "release\builder-debug.yml") {
            Copy-Item "release\builder-debug.yml" "release\failure-logs\" -Force
          }
          $npmLogs = Join-Path $env:LOCALAPPDATA "npm-cache\_logs"
          if (Test-Path $npmLogs) {
            Get-ChildItem $npmLogs -Filter "*.log" | Sort-Object LastWriteTime -Descending | Select-Object -First 5 | Copy-Item -Destination "release\failure-logs\" -Force
          }
          $failLines = @(
            '## Windows x64 Release Build Failed',
            "- Runner: windows-latest ($($env:RUNNER_ARCH))",
            "- Run ID / Number: $($env:GITHUB_RUN_ID) / #$($env:GITHUB_RUN_NUMBER)",
            "- Node: $(node -v)",
            "- npm: $(npm -v)",
            '- Inspect attached failure logs artifact and workflow step logs.'
          )
          $failLines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload failure diagnostic logs (Unique Run ID)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GoldenPalacePOS-Windows-Failure-Logs-run-${{ github.run_number }}-${{ github.run_id }}
          path: release/failure-logs/**/*
          retention-days: 90
          if-no-files-found: ignore
